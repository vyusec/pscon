name: Dependency audit

# New RustSec advisories appear without any change to this repository, so the
# lockfile on main is re-audited daily, and whenever deny.toml changes.
on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths: [deny.toml, Cargo.lock, Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2
      - name: Check RustSec advisories against Cargo.lock
        run: cargo deny --locked check advisories
