name: Run release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (patch for fixes, minor for features, major for breaking changes)
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: release-management
  cancel-in-progress: false

jobs:
  # Fail loudly (rather than silently skipping) when started from any branch but main.
  guard:
    name: Require main
    runs-on: ubuntu-24.04
    steps:
      - name: Releases are only cut from main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases can only be run from main (got $GITHUB_REF)."
            exit 1
          fi

  verify:
    needs: guard
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job alone commits the reviewed release version and tag.
          persist-credentials: true
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Refuse empty releases
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            count="$(git rev-list --count "$previous"..HEAD)"
            echo "Commits since $previous: $count"
            if [ "$count" = 0 ]; then
              echo "::error::No commits on main since $previous; nothing to release."
              exit 1
            fi
          else
            echo "No previous release tag; releasing all history."
          fi
      - name: Resolve the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(python3 scripts/bump-version.py "$BUMP" --dry-run)"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists; versions are never reused."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Generate release notes from Git history
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" \
            --jq .body > "$RUNNER_TEMP/release-notes.md"
      - name: Commit the version and create the release tag atomically
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main moved while CI ran; rerun the release against the latest main."
            exit 1
          fi
          python3 scripts/bump-version.py "$BUMP" --notes-file "$RUNNER_TEMP/release-notes.md"
          python3 scripts/check-release.py --tag "$RELEASE_TAG"
          # The bump must touch only the package version line in Cargo.lock.
          cargo metadata --locked --format-version 1 > /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"

  publish:
    needs: prepare
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
