[package]
name = "pscon"
description = "Browser-assisted reconnaissance console with an interactive TUI and headless CLI"
resolver = "2"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/vyusec/pscon"
readme = "README.md"
keywords = ["recon", "security", "cli", "javascript", "tui"]
categories = ["command-line-utilities"]
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "LICENSE", "NOTICE"]


[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "json", "tokio"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures-util = "0.3"
hex = "0.4"
ipnet = "2"
notify-rust = "4"
once_cell = "1"
oxc_allocator = "0.157"
oxc_ast = "0.157"
oxc_ast_visit = "0.157"
oxc_parser = "0.157"
oxc_span = "0.157"
rand = "0.9"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate", "cookies", "stream"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sourcemap = "9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
